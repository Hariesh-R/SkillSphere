name: Build and deploy Node.js app to Azure Web App - SkillSphere

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ./backend
        run: npm install

      - name: Upload backend
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./backend

  deploy:
    runs-on: ubuntu-latest
    needs: build

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: node-app

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_FBC399F44A474AB8AF4E2000F4DF25A7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2C7B599AD76C4999B0046DA21D1A78C3 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_C073A67D14254A519FD5B1BC34AE703B }}

      - name: Deploy
        uses: azure/webapps-deploy@v3
        with:
          app-name: SkillSphere
          slot-name: Production
          package: .
